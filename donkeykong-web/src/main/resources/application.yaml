server:
  port: 8081

spring:
  application:
    name: donkeykong-web
  messages:
    # without this an English visitor gets Czech on a Czech computer: there is no messages_en file
    fallback-to-system-locale: false

# Configuration for connecting to the donkeykong-db service
donkeykong:
  db:
    base-url: ${DONKEYKONG_DB_URL:http://localhost:8080}
